name: Container Scan (Reusable)

# Reusable workflow: scan a container image for known vulnerabilities with
# Trivy and Grype, publish the findings to the repository Security tab (SARIF),
# and optionally fail the run when issues at or above the chosen severity are
# found. Works against a published registry reference or an exported image
# tarball produced by the build workflow (used for pull requests).

on:
  workflow_call:
    inputs:
      scan-target:
        description: 'Image reference to scan (registry@digest or a local tag).'
        required: true
        type: string
      registry:
        description: 'Registry hostname (used when pulling a published image).'
        required: false
        type: string
        default: ghcr.io
      image-artifact:
        description: 'Exported image tarball artifact to load instead of pulling.'
        required: false
        type: string
        default: ''
      severity:
        description: 'Severities to report on.'
        required: false
        type: string
        default: CRITICAL,HIGH
      ignore-unfixed:
        description: 'Ignore vulnerabilities that have no fix available.'
        required: false
        type: boolean
        default: true
      fail-on-findings:
        description: 'Fail the run when matching vulnerabilities are found.'
        required: false
        type: boolean
        default: false
      upload-sarif:
        description: 'Upload SARIF results to the Security tab.'
        required: false
        type: boolean
        default: true

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download exported image
        if: inputs.image-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image-artifact }}
          path: /tmp

      - name: Load exported image
        if: inputs.image-artifact != ''
        run: docker load --input /tmp/image.tar

      - name: Log in to the registry
        if: inputs.image-artifact == ''
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.scan-target }}
          format: sarif
          output: trivy.sarif
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          vuln-type: os,library

      - name: Trivy scan (table gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.scan-target }}
          format: table
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          exit-code: ${{ inputs.fail-on-findings && '1' || '0' }}

      - name: Grype scan
        id: grype
        uses: anchore/scan-action@v7
        with:
          image: ${{ inputs.scan-target }}
          severity-cutoff: high
          fail-build: ${{ inputs.fail-on-findings }}
          output-format: sarif

      - name: Publish Trivy findings
        if: ${{ inputs.upload-sarif && always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Publish Grype findings
        if: ${{ inputs.upload-sarif && always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

      - name: Archive scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            trivy.sarif
            ${{ steps.grype.outputs.sarif }}
          retention-days: 30
          if-no-files-found: ignore
